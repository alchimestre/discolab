<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">discolab</title>
  <desc id="desc">Two taste areas, techno and ambient, each lead to the same artist you do not have yet. discolab ranks the artists that separate parts of your taste agree on.</desc>

  <rect width="1200" height="380" rx="24" fill="#111214"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="96" fill="#8b8f98" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="2">MUSIC DISCOVERY · LOCAL</text>
    <text x="60" y="186" fill="#f2f2f3" font-size="88" font-weight="700" letter-spacing="-2">discolab</text>
    <text x="64" y="238" fill="#c9cbd1" font-size="26">The artists two separate parts</text>
    <text x="64" y="272" fill="#c9cbd1" font-size="26">of your taste both lead to.</text>
    <text x="64" y="330" fill="#8b8f98" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">files · Last.fm · Spotify · rekordbox → one SQLite graph</text>
  </g>

  <g id="map" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g stroke="#f2f2f3" stroke-opacity="0.14" stroke-width="2">
      <line x1="800" y1="120" x2="690" y2="250"/>
      <line x1="800" y1="120" x2="930" y2="90"/>
      <line x1="1040" y1="260" x2="930" y2="90"/>
      <line x1="1040" y1="260" x2="1120" y2="150"/>
      <line x1="690" y1="250" x2="760" y2="330"/>
    </g>

    <g stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M 836 152 Q 880 220 912 238" stroke="#e46f9a" stroke-dasharray="2 10"/>
      <path d="M 1004 248 Q 968 246 948 244" stroke="#8f8cf2" stroke-dasharray="2 10"/>
    </g>

    <circle cx="690" cy="250" r="26" fill="#3fb6a0" fill-opacity="0.28" stroke="#3fb6a0" stroke-width="2"/>
    <circle cx="930" cy="90" r="22" fill="#d9a441" fill-opacity="0.28" stroke="#d9a441" stroke-width="2"/>
    <circle cx="1120" cy="150" r="18" fill="#6fb3e6" fill-opacity="0.28" stroke="#6fb3e6" stroke-width="2"/>
    <circle cx="760" cy="330" r="14" fill="#b38fdf" fill-opacity="0.28" stroke="#b38fdf" stroke-width="2"/>

    <circle cx="800" cy="120" r="56" fill="#e46f9a" fill-opacity="0.3" stroke="#e46f9a" stroke-width="2.5"/>
    <text x="800" y="116" fill="#f2f2f3" font-size="22" font-weight="600">techno</text>
    <text x="800" y="142" fill="#c9cbd1" font-size="18">289 artists</text>

    <circle cx="1040" cy="260" r="48" fill="#8f8cf2" fill-opacity="0.3" stroke="#8f8cf2" stroke-width="2.5"/>
    <text x="1040" y="256" fill="#f2f2f3" font-size="22" font-weight="600">ambient</text>
    <text x="1040" y="282" fill="#c9cbd1" font-size="18">220 artists</text>

    <circle cx="930" cy="242" r="13" fill="#f2f2f3"/>
    <circle cx="930" cy="242" r="22" fill="none" stroke="#f2f2f3" stroke-opacity="0.45" stroke-width="2"/>
    <text x="930" y="300" fill="#f2f2f3" font-size="20" font-weight="600">new to you</text>
  </g>
</svg>
