[project]
name = "discolab"
version = "0.1.0"
description = "Build a taste graph from local music metadata and query the blank space between clusters"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.26",
    "mutagen>=1.47",
    "networkx>=3.3",
    "typer>=0.15",
]

[project.scripts]
discolab = "discolab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discolab"]

[dependency-groups]
dev = ["pytest>=8.3"]
